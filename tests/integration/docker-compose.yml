# =============================================================================
# docker-compose.yml — pg_failover_slots_rs integration test
#
# Topology:
#   primary  -> physical streaming replication -> standby
#   primary  -> logical replication            -> subscriber
#
# The test verifies that after failover (promote standby),
# the logical replication slot survives on the new primary.
# =============================================================================
version: "3.8"

services:
  # -------------------------------------------------------------------------
  # PRIMARY: PostgreSQL with pg_failover_slots_rs loaded
  # -------------------------------------------------------------------------
  primary:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "16"
    container_name: pfs_primary
    hostname: primary
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "15432:5432"
    volumes:
      - ./conf/primary-setup.sh:/docker-entrypoint-initdb.d/01-setup.sh
    command: >
      postgres
        -c shared_preload_libraries=pg_failover_slots_rs
        -c wal_level=logical
        -c max_replication_slots=10
        -c max_wal_senders=10
        -c hot_standby=on
        -c hot_standby_feedback=on
        -c wal_log_hints=on
        -c max_worker_processes=10
        -c listen_addresses='*'
        -c logging_collector=off
        -c log_destination=stderr
        -c log_statement=all
        -c "pg_failover_slots_rs.standby_slot_names=standby_slot"
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # STANDBY: Physical streaming replica with pg_failover_slots_rs
  # -------------------------------------------------------------------------
  standby:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        PG_MAJOR: "16"
    container_name: pfs_standby
    hostname: standby
    environment:
      POSTGRES_PASSWORD: testpass
      PGPASSWORD: testpass
    ports:
      - "15433:5432"
    depends_on:
      primary:
        condition: service_healthy
    volumes:
      - ./conf/standby-setup.sh:/standby-setup.sh
    entrypoint: /standby-setup.sh
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # SUBSCRIBER: Downstream logical replication subscriber
  # -------------------------------------------------------------------------
  subscriber:
    image: postgres:16-bookworm
    container_name: pfs_subscriber
    hostname: subscriber
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_USER: postgres
      POSTGRES_DB: testdb
    ports:
      - "15434:5432"
    depends_on:
      primary:
        condition: service_healthy
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=10
        -c max_wal_senders=5
        -c listen_addresses='*'
        -c logging_collector=off
        -c log_destination=stderr
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # TEST RUNNER: Executes the failover integration test
  # -------------------------------------------------------------------------
  test-runner:
    image: postgres:16-bookworm
    container_name: pfs_test_runner
    hostname: test-runner
    depends_on:
      primary:
        condition: service_healthy
      standby:
        condition: service_healthy
      subscriber:
        condition: service_healthy
    environment:
      PGPASSWORD: testpass
      PRIMARY_HOST: primary
      STANDBY_HOST: standby
      SUBSCRIBER_HOST: subscriber
    volumes:
      - ./run_failover_test.sh:/run_failover_test.sh
    entrypoint: ["bash", "/run_failover_test.sh"]
    networks:
      - pgnet

networks:
  pgnet:
    driver: bridge
